<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成 - 流色派</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .converter-container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .converter-header { text-align: center; margin-bottom: 40px; }
        .converter-header h1 { font-size: 2rem; margin-bottom: 10px; }
        .converter-header p { color: #666; }
        .password-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 24px; border-radius: 12px;
            font-size: 1.5rem; font-family: 'Courier New', monospace;
            text-align: center; word-break: break-all; margin-bottom: 24px;
            min-height: 80px; display: flex; align-items: center; justify-content: center;
        }
        .btn-row { display: flex; gap: 12px; margin-bottom: 30px; justify-content: center; }
        .btn {
            padding: 14px 28px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; transition: all 0.2s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #f8f9fa; color: #333; border: 2px solid #e0e0e0; }
        .btn-secondary:hover { background: #e9ecef; }
        .options { background: #f8f9fa; padding: 24px; border-radius: 12px; }
        .option-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .option-row:last-child { margin-bottom: 0; }
        .option-label { font-size: 14px; color: #333; display: flex; align-items: center; gap: 8px; }
        .option-label input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .length-control { display: flex; align-items: center; gap: 12px; }
        .length-slider { flex: 1; height: 6px; -webkit-appearance: none; background: #ddd; border-radius: 3px; cursor: pointer; }
        .length-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #667eea; border-radius: 50%; cursor: pointer; }
        .length-value { font-size: 1.2rem; font-weight: 700; color: #667eea; min-width: 40px; text-align: center; }
        .strength-bar { display: flex; gap: 6px; margin-top: 20px; }
        .strength-segment { flex: 1; height: 8px; border-radius: 4px; background: #e0e0e0; transition: background 0.3s; }
        .strength-segment.active.weak { background: #dc3545; }
        .strength-segment.active.medium { background: #ffc107; }
        .strength-segment.active.strong { background: #28a745; }
        .strength-label { text-align: center; margin-top: 8px; font-size: 14px; font-weight: 600; }
        .copy-success { color: #28a745; font-size: 14px; margin-left: 12px; display: none; }
        .copy-success.show { display: inline; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">流色派</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">首页</a>
                <a href="articles.html" class="nav-link">文章</a>
            </nav>
        </div>
    </header>
    <main class="main">
        <section class="section">
            <div class="container">
                <div class="converter-container">
                    <div class="converter-header">
                        <h1>随机密码生成</h1>
                        <p>生成安全的随机密码</p>
                    </div>
                    <div class="password-display" id="passwordDisplay">点击下方按钮生成密码</div>
                    <div class="btn-row">
                        <button class="btn btn-primary" id="generateBtn">生成密码</button>
                        <button class="btn btn-secondary" id="copyBtn">复制 <span class="copy-success" id="copySuccess">已复制!</span></button>
                    </div>
                    <div class="options">
                        <div class="option-row">
                            <span class="option-label">密码长度</span>
                            <div class="length-control">
                                <input type="range" class="length-slider" id="lengthSlider" min="6" max="32" value="16">
                                <span class="length-value" id="lengthValue">16</span>
                            </div>
                        </div>
                        <div class="option-row">
                            <label class="option-label">
                                <input type="checkbox" id="optUppercase" checked> 大写字母 (A-Z)
                            </label>
                        </div>
                        <div class="option-row">
                            <label class="option-label">
                                <input type="checkbox" id="optLowercase" checked> 小写字母 (a-z)
                            </label>
                        </div>
                        <div class="option-row">
                            <label class="option-label">
                                <input type="checkbox" id="optNumbers" checked> 数字 (0-9)
                            </label>
                        </div>
                        <div class="option-row">
                            <label class="option-label">
                                <input type="checkbox" id="optSymbols"> 特殊字符 (!@#$%^&*)
                            </label>
                        </div>
                        <div class="strength-bar" id="strengthBar">
                            <div class="strength-segment" id="seg1"></div>
                            <div class="strength-segment" id="seg2"></div>
                            <div class="strength-segment" id="seg3"></div>
                            <div class="strength-segment" id="seg4"></div>
                        </div>
                        <div class="strength-label" id="strengthLabel"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 流色派. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">关于我们</a>
                <a href="privacy.html">隐私政策</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </footer>
    <script>
        const display = document.getElementById('passwordDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copySuccess = document.getElementById('copySuccess');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const optUppercase = document.getElementById('optUppercase');
        const optLowercase = document.getElementById('optLowercase');
        const optNumbers = document.getElementById('optNumbers');
        const optSymbols = document.getElementById('optSymbols');
        const strengthBar = document.getElementById('strengthBar');
        const strengthLabel = document.getElementById('strengthLabel');

        let currentPassword = '';

        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            let chars = '';
            if (optUppercase.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (optLowercase.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (optNumbers.checked) chars += '0123456789';
            if (optSymbols.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (!chars) {
                display.textContent = '请至少选择一种字符类型';
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentPassword = password;
            display.textContent = password;
            updateStrength(password);
        }

        function updateStrength(password) {
            const segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3'), document.getElementById('seg4')];
            segs.forEach(s => s.className = 'strength-segment');

            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) score++;

            const labels = ['', '弱', '中等', '强', '非常强'];
            const levels = ['', 'weak', 'medium', 'strong', 'strong'];

            if (password.length > 0) {
                for (let i = 0; i < score; i++) {
                    segs[i].classList.add('active', levels[score]);
                }
                strengthLabel.textContent = labels[score] || '';
            } else {
                strengthLabel.textContent = '';
            }
        }

        function copyPassword() {
            if (!currentPassword) return;
            navigator.clipboard.writeText(currentPassword).then(() => {
                copySuccess.classList.add('show');
                setTimeout(() => copySuccess.classList.remove('show'), 2000);
            });
        }

        generateBtn.addEventListener('click', generatePassword);
        copyBtn.addEventListener('click', copyPassword);
        lengthSlider.addEventListener('input', () => {
            lengthValue.textContent = lengthSlider.value;
        });
        [optUppercase, optLowercase, optNumbers, optSymbols].forEach(el => {
            el.addEventListener('change', () => {
                if (!optUppercase.checked && !optLowercase.checked && !optNumbers.checked && !optSymbols.checked) {
                    optLowercase.checked = true;
                }
            });
        });

        // Generate initial password
        generatePassword();
    </script>
</body>
</html>
