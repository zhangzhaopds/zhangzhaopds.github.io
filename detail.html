<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>壁纸详情 - 流色壁纸</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">流色壁纸</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">首页</a>
                <a href="category.html" class="nav-link">分类</a>
                <a href="privacy.html" class="nav-link">隐私政策</a>
                <a href="contact.html" class="nav-link">联系我们</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="detail-container">
                <div class="detail-image-wrapper">
                    <img id="wallpaperImage" src="" alt="壁纸预览" class="detail-image">
                </div>
                <div class="detail-info">
                    <h1 id="wallpaperTitle" class="detail-title">壁纸预览</h1>
                    <div class="detail-meta">
                        <span id="wallpaperSize" class="meta-item">尺寸: 加载中...</span>
                        <span id="wallpaperResolution" class="meta-item">分辨率: 加载中...</span>
                    </div>
                    <div class="detail-actions">
                        <button id="downloadBtn" class="btn btn-primary">下载壁纸</button>
                        <button id="setWallpaperBtn" class="btn btn-secondary">设为桌面</button>
                    </div>
                    <div class="detail-description">
                        <p>点击"下载壁纸"按钮即可保存高清原图到本地。</p>
                        <p>点击"设为桌面"可将该壁纸设置为电脑桌面。</p>
                    </div>
                </div>
            </div>

            <!-- 广告位 -->
            <div class="ad-section">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-YOUR_PUBLISHER_ID"
                     data-ad-slot="YOUR_AD_SLOT"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>

            <div class="back-link">
                <a href="index.html">&larr; 返回首页</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2024 流色壁纸. All rights reserved.</p>
            <div class="footer-links">
                <a href="privacy.html">隐私政策</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </footer>

    <script src="js/detail.js"></script>
</body>
</html>
