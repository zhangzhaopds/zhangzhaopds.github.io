<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流色派 - 在线工具箱</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero {
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 0 0 24px 24px;
            margin: 0 -20px;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 2.5rem;
            margin-bottom: 16px;
            color: white;
            font-weight: 700;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0;
            font-weight: 400;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 0 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tool-card {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border-color: #007bff;
        }

        .tool-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .tool-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .tool-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .section {
            padding: 40px 0;
        }

        .ad-section {
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">流色派</a>
            <nav class="nav">
                <a href="index.html" class="nav-link active">首页</a>
                <a href="articles.html" class="nav-link">文章</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="container">
                <h1 class="hero-title">在线工具箱</h1>
                <p class="hero-subtitle">免费实用的在线工具集合</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="tools-grid">
                    <a href="pdf2image.html" class="tool-card">
                        <div class="tool-icon">📄</div>
                        <div class="tool-title">PDF 转图片</div>
                        <div class="tool-desc">将 PDF 文件转换为 PNG/JPEG 图片，支持多页批量转换</div>
                    </a>

                    <a href="color-converter.html" class="tool-card">
                        <div class="tool-icon">🎨</div>
                        <div class="tool-title">颜色值转换</div>
                        <div class="tool-desc">HEX 与 RGBA 互转，实时预览颜色效果</div>
                    </a>

                    <a href="base-converter.html" class="tool-card">
                        <div class="tool-icon">🔢</div>
                        <div class="tool-title">进制转换</div>
                        <div class="tool-desc">二进制、八进制、十进制、十六进制互转</div>
                    </a>

                    <a href="reaction-test.html" class="tool-card">
                        <div class="tool-icon">⚡</div>
                        <div class="tool-title">反应速度测试</div>
                        <div class="tool-desc">测试你的反应速度，记录最快速度和平均时间</div>
                    </a>
                </div>
            </div>
        </section>

        <section class="section ad-section">
            <div class="container">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-6710008629258058"
                     data-ad-slot="2841079158"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 流色派. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">关于我们</a>
                <a href="privacy.html">隐私政策</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </footer>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6710008629258058" crossorigin="anonymous"></script>
</body>
</html>
