<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流色派 - 壁纸技巧与色彩心理学</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6710008629258058" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">流色派</a>
            <nav class="nav">
                <a href="index.html" class="nav-link active">首页</a>
                <a href="articles.html" class="nav-link">文章</a>
                <a href="pdf2image.html" class="nav-link">PDF转图片</a>
                <a href="color-converter.html" class="nav-link">颜色转换</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="container">
                <h1 class="hero-title">壁纸技巧与色彩心理学</h1>
                <p class="hero-subtitle">探索色彩与视觉的秘密</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">最新文章</h2>
                    <a href="articles.html" class="more-link">更多 &rarr;</a>
                </div>
                <div id="articleGrid" class="article-grid">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </section>

        <!-- 关注我们 -->
        <section class="section follow-section">
            <div class="container">
                <h2 class="section-title">关注我们</h2>
                <p class="follow-intro">扫码关注公众号，或在微信搜索「流小色」小程序获取更多壁纸</p>
                <div class="follow-qr-codes">
                    <div class="follow-qr-item">
                        <img src="images/liusepai.png" alt="流色派公众号" class="follow-qr-img">
                        <p class="follow-qr-label">公众号：流色派</p>
                    </div>
                    <div class="follow-qr-item">
                        <img src="images/liuxiaose.png" alt="流小色小程序" class="follow-qr-img">
                        <p class="follow-qr-label">小程序：流小色</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 广告位 -->
        <section class="section ad-section">
            <div class="container">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-6710008629258058"
     data-ad-slot="2841079158"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 流色派. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">关于我们</a>
                <a href="privacy.html">隐私政策</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </footer>

    <script>
        // 加载文章列表到首页
        fetch('data/articles.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('articleGrid');
                // 按日期倒序排序，取前6篇
                const articles = data.articles
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                    .slice(0, 6);

                if (articles.length === 0) {
                    grid.innerHTML = '<p class="no-data">暂无文章</p>';
                    return;
                }

                grid.innerHTML = articles.map(article => `
                    <a href="article.html?id=${article.id}" class="article-card">
                        <h3 class="article-card-title">${article.title}</h3>
                        <p class="article-card-excerpt">${article.excerpt}</p>
                        <span class="article-card-date">${article.date}</span>
                    </a>
                `).join('');
            })
            .catch(error => {
                document.getElementById('articleGrid').innerHTML = '<p class="error">加载失败</p>';
            });
    </script>
</body>
</html>
