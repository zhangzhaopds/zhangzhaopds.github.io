<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成与解析 - 流色派</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .converter-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .converter-header { text-align: center; margin-bottom: 40px; }
        .converter-header h1 { font-size: 2rem; margin-bottom: 10px; }
        .converter-header p { color: #666; }
        .tabs { display: flex; gap: 12px; margin-bottom: 30px; justify-content: center; }
        .tab {
            padding: 12px 28px; border: 2px solid #e0e0e0; border-radius: 8px;
            background: white; cursor: pointer; font-size: 15px; font-weight: 600;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #667eea; }
        .tab.active { background: #667eea; border-color: #667eea; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .text-input {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 16px; resize: vertical;
            min-height: 100px; box-sizing: border-box;
        }
        .text-input:focus { outline: none; border-color: #667eea; }
        .btn {
            padding: 12px 28px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 15px; transition: all 0.2s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #f8f9fa; color: #333; border: 2px solid #e0e0e0; }
        .btn-secondary:hover { background: #e9ecef; }
        .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .qr-preview {
            background: white; padding: 20px; border-radius: 12px;
            border: 2px solid #e0e0e0; text-align: center; margin-top: 20px;
            min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .qr-preview img { max-width: 200px; height: auto; }
        .qr-placeholder { color: #999; font-size: 14px; }
        .result-box {
            padding: 16px; border: 2px solid #28a745; border-radius: 8px;
            background: #f8f9fa; font-size: 15px; word-break: break-all;
            margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .result-text { flex: 1; }
        .copy-btn {
            padding: 8px 16px; background: #28a745; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap;
        }
        .copy-btn:hover { background: #218838; }
        .error-text { color: #dc3545; font-size: 13px; margin-top: 8px; display: none; text-align: center; }
        .error-text.show { display: block; }
        .success-text { color: #28a745; font-size: 13px; margin-top: 8px; display: none; text-align: center; }
        .success-text.show { display: block; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 12px 24px; border-radius: 8px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            z-index: 10001;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">流色派</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">首页</a>
                <a href="articles.html" class="nav-link">文章</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="section">
            <div class="container">
                <div class="converter-container">
                    <div class="converter-header">
                        <h1>二维码生成与解析</h1>
                        <p>输入文本生成二维码，或上传二维码图片解析内容</p>
                    </div>

                    <div class="tabs">
                        <button class="tab active" id="tabGenerate" onclick="switchTab('generate')">生成二维码</button>
                        <button class="tab" id="tabParse" onclick="switchTab('parse')">解析二维码</button>
                    </div>

                    <!-- Generate Tab -->
                    <div class="tab-content active" id="generateTab">
                        <div class="input-group">
                            <label class="input-label">输入内容</label>
                            <textarea id="generateInput" class="text-input" placeholder="输入要生成二维码的文本...">https://example.com</textarea>
                        </div>
                        <button class="btn btn-primary" onclick="generateQR()">生成二维码</button>
                        <div class="qr-preview" id="generatePreview">
                            <span class="qr-placeholder">二维码将在此处显示</span>
                        </div>
                        <div id="downloadArea" style="display:none; text-align:center; margin-top:16px;">
                            <button class="btn btn-primary" onclick="downloadQR()">下载二维码</button>
                        </div>
                    </div>

                    <!-- Parse Tab -->
                    <div class="tab-content" id="parseTab">
                        <div class="input-group">
                            <label class="input-label">上传二维码图片</label>
                            <input type="file" id="parseFile" accept="image/*" onchange="handleFileSelect(this)">
                            <div class="btn-row" style="margin-top:12px;">
                                <button class="btn btn-secondary" onclick="document.getElementById('parseFile').click()">选择图片</button>
                            </div>
                            <p id="fileName" style="font-size:13px;color:#666;margin-top:8px;"></p>
                        </div>
                        <div class="qr-preview" id="parsePreview">
                            <span class="qr-placeholder">上传图片后将自动解析</span>
                        </div>
                        <div id="parseResultArea" style="display:none;">
                            <div class="result-box">
                                <span class="result-text" id="parseResultText"></span>
                                <button class="copy-btn" onclick="copyResult()">复制</button>
                            </div>
                            <p id="successMsg" class="success-text">解析成功</p>
                        </div>
                        <p id="parseError" class="error-text">无法解析此图片，请确保二维码清晰可见</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">已复制</div>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 流色派. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">关于我们</a>
                <a href="privacy.html">隐私政策</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
    <script>
        let qrInstance = null;
        let lastParsedData = '';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function switchTab(tab) {
            document.getElementById('tabGenerate').classList.remove('active');
            document.getElementById('tabParse').classList.remove('active');
            document.getElementById('generateTab').classList.remove('active');
            document.getElementById('parseTab').classList.remove('active');

            if (tab === 'generate') {
                document.getElementById('tabGenerate').classList.add('active');
                document.getElementById('generateTab').classList.add('active');
            } else {
                document.getElementById('tabParse').classList.add('active');
                document.getElementById('parseTab').classList.add('active');
            }
        }

        function generateQR() {
            const text = document.getElementById('generateInput').value.trim();
            if (!text) {
                alert('请输入内容');
                return;
            }

            const preview = document.getElementById('generatePreview');
            preview.innerHTML = '';
            document.getElementById('downloadArea').style.display = 'none';

            qrInstance = new QRCode(preview, {
                text: text,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                document.getElementById('downloadArea').style.display = 'block';
            }, 200);
        }

        function downloadQR() {
            const preview = document.getElementById('generatePreview');
            const canvas = preview.querySelector('canvas');
            const img = preview.querySelector('img');

            if (canvas) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('二维码已下载');
            } else if (img) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = img.src;
                link.click();
                showToast('二维码已下载');
            }
        }

        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById('fileName').textContent = '已选择: ' + file.name;
            document.getElementById('parseResultArea').style.display = 'none';
            document.getElementById('parseError').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');

            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('parsePreview');
                preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:200px; max-height:200px;">';

                const img = new Image();
                img.onload = function() {
                    decodeQRImage(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function decodeQRImage(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);

            try {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);

                if (code) {
                    lastParsedData = code.data;
                    document.getElementById('parseResultText').textContent = code.data;
                    document.getElementById('parseResultArea').style.display = 'block';
                    document.getElementById('parseError').classList.remove('show');
                    document.getElementById('successMsg').classList.add('show');
                } else {
                    document.getElementById('parseError').classList.add('show');
                }
            } catch (err) {
                document.getElementById('parseError').classList.add('show');
            }
        }

        function copyResult() {
            if (!lastParsedData) return;
            navigator.clipboard.writeText(lastParsedData).then(() => {
                showToast('已复制到剪贴板');
            });
        }

        // Generate initial QR on page load
        window.onload = function() {
            generateQR();
        };
    </script>
</body>
</html>
