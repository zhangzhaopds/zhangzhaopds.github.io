<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 流色派</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">流色派</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">首页</a>
                <a href="privacy.html" class="nav-link">隐私政策</a>
                <a href="contact.html" class="nav-link active">联系我们</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="section">
            <div class="container">
                <div class="contact-container">
                    <h1>联系我们</h1>
                    <p class="contact-intro">我们欢迎您提出宝贵意见和问题。请通过以下方式与我们联系：</p>

                    <div class="contact-methods">
                        <div class="contact-method">
                            <h3>电子邮件</h3>
                            <p>contact@liusepai.com</p>
                        </div>
                        <div class="contact-method">
                            <h3>工作时间</h3>
                            <p>周一至周五: 9:00 - 18:00</p>
                        </div>
                    </div>

                    <div class="contact-form">
                        <h3>发送消息</h3>
                        <form id="contactForm">
                            <div class="form-group">
                                <label for="name">姓名</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">电子邮箱</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="subject">主题</label>
                                <input type="text" id="subject" name="subject" required>
                            </div>
                            <div class="form-group">
                                <label for="message">留言内容</label>
                                <textarea id="message" name="message" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">发送消息</button>
                        </form>
                    </div>

                    <div class="contact-info">
                        <h3>其他信息</h3>
                        <p>网站: www.liusepai.com</p>
                        <p>我们通常会在1-2个工作日内回复您的邮件。</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2024 流色派. All rights reserved.</p>
            <div class="footer-links">
                <a href="privacy.html">隐私政策</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('感谢您的留言！我们会尽快回复您。');
            this.reset();
        });
    </script>
</body>
</html>
