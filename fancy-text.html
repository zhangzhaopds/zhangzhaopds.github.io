<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花体英文转换器 - 流色派</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .converter-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .converter-header { text-align: center; margin-bottom: 40px; }
        .converter-header h1 { font-size: 2rem; margin-bottom: 10px; }
        .converter-header p { color: #666; }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .text-input {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 16px; resize: vertical;
            min-height: 100px; box-sizing: border-box; font-family: inherit;
        }
        .text-input:focus { outline: none; border-color: #667eea; }
        .word-count { text-align: right; font-size: 13px; color: #999; margin-top: 8px; }
        .tips { font-size: 13px; color: #999; margin-top: 12px; line-height: 1.6; }
        .font-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .font-item {
            background: #f8f9fa; border: 2px solid #e0e0e0;
            border-radius: 10px; padding: 16px; display: flex;
            flex-direction: column; gap: 10px;
        }
        .font-preview {
            font-size: 20px; min-height: 50px; word-break: break-all;
            display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
        }
        .font-name { font-size: 12px; color: #888; }
        .copy-btn {
            padding: 8px 16px; background: #667eea; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 13px; align-self: flex-start;
        }
        .copy-btn:hover { background: #5a6fd6; }
        .copy-btn.copied { background: #28a745; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 12px 24px; border-radius: 8px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            z-index: 10001;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">流色派</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">首页</a>
                <a href="articles.html" class="nav-link">文章</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="section">
            <div class="container">
                <div class="converter-container">
                    <div class="converter-header">
                        <h1>花体英文转换器</h1>
                        <p>将英文转换为多种装饰字体样式</p>
                    </div>

                    <div class="input-group">
                        <label class="input-label">输入英文</label>
                        <textarea id="inputText" class="text-input" placeholder="请输入需要转换的英文文本...">Hello World</textarea>
                        <div class="word-count"><span id="charCount">0</span> / 500</div>
                    </div>

                    <p class="tips">提示：仅支持转换英文字母和数字，转换结果可直接点击复制</p>

                    <div class="font-grid" id="fontGrid"></div>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">已复制</div>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 流色派. All rights reserved.</p>
            <div class="footer-links">

                <a href="contact.html">联系我们</a>
            </div>
        </div>
    </footer>

        const inputText = document.getElementById('inputText');
        const charCount = document.getElementById('charCount');
        const fontGrid = document.getElementById('fontGrid');

        inputText.addEventListener('input', function() {
            charCount.textContent = this.value.length;
            if (this.value.length > 500) {
                this.value = this.value.substring(0, 500);
                charCount.textContent = 500;
            }
            renderFonts();
        });

        function convertText(text, charsMap) {
            let result = '';
            for (let char of text) {
                if (charsMap[char]) {
                    result += charsMap[char];
                } else {
                    result += char;
                }
            }
            return result;
        }

        function renderFonts() {
            const text = inputText.value || 'Hello World';
            fontGrid.innerHTML = '';

            for (const [key, font] of Object.entries(fontMap)) {
                const converted = convertText(text, font.chars);
                const item = document.createElement('div');
                item.className = 'font-item';
                item.innerHTML = `
                    <div class="font-name">${font.name}</div>
                    <div class="font-preview">${converted}</div>
                    <button class="copy-btn" onclick="copyText(this, '${key}')">复制</button>
                `;
                fontGrid.appendChild(item);
            }
        }

        function copyText(btn, key) {
            const text = inputText.value || 'Hello World';
            const charsMap = fontMap[key].chars;
            const converted = convertText(text, charsMap);

            navigator.clipboard.writeText(converted).then(() => {
                btn.textContent = '已复制';
                btn.classList.add('copied');
                showToast('已复制到剪贴板');
                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Initial render
        charCount.textContent = inputText.value.length;
        renderFonts();
    </script>
